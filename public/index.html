<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Life Sciences Course Chooser Quiz - Imperial College London"
    />
    <title>Life Sciences Course Chooser</title>

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      /* --- Background layers --- */
      #global-bg {
        position: fixed;
        inset: 0;
        background-image: url("/images/background.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        opacity: 0;
        transition: opacity 0.6s ease-in-out; /* faster fade */
        z-index: -2;
      }

      #global-bg.loaded {
        opacity: 1;
      }

      #global-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(1px);
        z-index: -1;
        transition: background 0.4s ease;
      }
    </style>

    <script>
      // Trigger fade-in once the background image has loaded
      document.addEventListener("DOMContentLoaded", () => {
        const bg = document.getElementById("global-bg");
        const img = new Image();
        img.src = "/images/background.jpg";
        img.onload = () => bg.classList.add("loaded");
      });
    </script>
  </head>

  <body class="bg-gray-50">
    <!-- Persistent background + overlay -->
    <div id="global-bg" aria-hidden="true"></div>
    <div id="global-overlay" aria-hidden="true"></div>

    <!-- React root -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
